services:
  postgres:
    image: postgres:16-alpine
    container_name: solarhub-postgres
    environment:
      POSTGRES_DB: solarhub
      POSTGRES_USER: solarhub
      POSTGRES_PASSWORD: solarhub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solarhub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: