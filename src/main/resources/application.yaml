spring:
  application:
    name: solar-hub

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:solarhub}
    username: ${DB_USER:solarhub}
    password: ${DB_PASSWORD:solarhub}

  jpa:
    hibernate:
      # The schema belongs to Flyway, not Hibernate.
      # "validate" makes the app fail on startup if an entity doesn't match the database.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  jwt:
    # Must be at least 32 bytes long for HS256. Override with the JWT_SECRET env var in production.
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
    expiration: 24h